.intro .iphoto{position:absolute;left:0;top:50%;width:max(112vw,167.5vh);aspect-ratio:1623/969;background:#1a2217 url("./baggrund-radar.jpg") center/100% 100% no-repeat;opacity:0;transform:translate3d(var(--x0,0px),-50%,0);will-change:transform,opacity}
.intro.run .iphoto{animation:iFade 1.1s ease .5s forwards,iPan 5s cubic-bezier(.37,0,.4,1) .3s forwards}
.intro .ishade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,24,15,.78) 0%,rgba(17,24,15,.30) 38%,rgba(17,24,15,.18) 60%,rgba(17,24,15,.70) 100%)}
.intro .itext{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 13vh);padding:0 20px;text-align:center;color:#fff}
.intro .il{opacity:0;transform:translateY(10px)}
.intro.run .il{animation:iUp .7s ease forwards}
.intro.run .il1{animation-delay:1.5s}.intro.run .il2{animation-delay:1.75s}.intro.run .il3{animation-delay:2.1s}
.intro .il1{display:flex;align-items:center;justify-content:center;gap:12px;color:#e3cf98;font-weight:800;letter-spacing:.08em;font-size:clamp(18px,4.6vw,34px);text-shadow:0 2px 8px #000a}
.intro .il1:before,.intro .il1:after{content:"";height:1px;width:clamp(28px,10vw,110px);background:#c9b98a}
.intro .il2{margin:6px 0 14px;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(40px,12vw,96px);line-height:1;letter-spacing:.02em;text-shadow:0 3px 14px #000c}
.intro .il3{display:inline-block;padding:8px 14px;background:rgba(24,32,20,.82);border:1px solid #c9b98a;border-radius:2px;color:#fff;font-weight:700;font-size:clamp(14px,3.6vw,22px)}
.intro .iskip{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));min-height:44px;padding:0 16px;border:1px solid #c9b98a;border-radius:2px;background:rgba(24,32,20,.7);color:#fff;font:inherit;font-weight:700;font-size:14px;letter-spacing:.04em}
@keyframes iFade{to{opacity:1}}
@keyframes iPan{from{transform:translate3d(var(--x0,0px),-50%,0)}to{transform:translate3d(var(--x1,0px),-50%,0)}}
@keyframes iUp{to{opacity:1;transform:none}}
</style></head><body><div class="sbar" aria-hidden="true"></div><div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Billede"><button type="button" class="lbclose" onclick="closePhoto()" aria-label="Luk">×</button><div class="lbimgwrap"><img id="lbImg" alt=""></div><div class="lbcap"><b id="lbTitle"></b><span id="lbMeta"></span><p id="lbDesc"></p></div></div><main class="app">
<section id="home" class="section active"><header class="hero"><img class="heroimg" src="./hero-login.jpg" alt="Soldat ved Morterpejleradar M113 – Artilleriet i Varde" width="1659" height="948" fetchpriority="high"><div class="herooverlay"><h1>ST- &amp; MÅLOPKBT Reunion</h1><p>Reunion 2027 · Varde Kaserne</p></div></header><div class="content"><div class="homeintro"><div class="motto" id="rMotto">“Skuld gammel venskab rejn forgå”</div><div class="datebox"><div class="pill"><svg class="pico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span data-r="dato">Lørdag 29. maj 2027</span></div><div class="pill"><svg class="pico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-6.2-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.3"/></svg><span data-r="sted">Varde Kaserne</span></div></div></div><div class="radarwin" aria-hidden="true"></div><button type="button" class="notice newsnotice hidden" id="homeNews" onclick="show('news',navBtn('news'))"><b class="nlabel">Seneste nyt</b><span id="homeNewsTitle"></span><span class="nmore" id="homeNewsText"></span></button><div class="grid homegrid">

<button class="card" onclick="show('reunion')"><b><em class="cnum"></em>Reunion 2027</b><span id="cReunion">Velkomst og praktisk</span></button>

</main><nav class="bottom"><button class="nav active" data-s="home" onclick="show('home',this)"><i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5.5h4V20"/></svg></i>Hjem</button><button class="nav" data-s="program" onclick="show('program',this)"><i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="1.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></i>Program</button><button class="nav" data-s="news" onclick="show('news',this)"><i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M7 9h10M7 12.5h10M7 16h6"/></svg></i>Nyheder</button><button class="nav" data-s="photos" onclick="show('photos',this)"><i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5h3.5l1.8-2.5h6.4l1.8 2.5h3.5V19h-17z"/><circle cx="12" cy="13.2" r="3.3"/></svg></i>Billeder</button><button class="nav" data-s="contact" onclick="show('contact',this)"><i><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h3l1.5 4.5-2 1.5a11 11 0 0 0 5.5 5.5l1.5-2 4.5 1.5v3a1.5 1.5 0 0 1-1.6 1.5C11.4 18.6 5.4 12.6 5 5.1a1.5 1.5 0 0 1 1.5-1.6z"/></svg></i>Kontakt</button></nav>
<script>
/* ===== CONFIG – informationsversion =====
   STATIC_MODE: appen henter kun egne filer fra GitHub Pages. Ingen login, ingen database.
   Supabase-versionen ligger uændret i grenen "supabase-version". */
const CONFIG = {
  STATIC_MODE: true,
  contentBase: './indhold/',
  files: ['reunion', 'program', 'nyheder', 'arrangementer', 'historie', 'billeder', 'kontakt'],
  oldPrivateKeys: [/^r27-auth/, /^sb-/]   // login-sessioner fra den tidligere version slettes
};

const DATA = {};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const paras = s => String(s || '').split(/\n{2,}/).map(p => p.trim()).filter(Boolean).map(p => '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>').join('');
const visible = a => (Array.isArray(a) ? a : []).filter(x => x && x.vis !== false);
// Billedstier fra redaktøren ("/billeder/x.jpg") gøres relative, så de virker på GitHub Pages-projektadressen.
const imgPath = p => { p = String(p || '').trim(); if (!p || /^(javascript|data):/i.test(p)) return ''; if (/^https?:\/\//i.test(p)) return p; return './' + p.replace(/^\.?\/+/, ''); };
function fmtDate(d) {
  if (!d) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d); if (!m) return esc(d);
  try { return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('da-DK', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return esc(d); }
}

function navBtn(id) { return document.querySelector('.nav[data-s="' + id + '"]'); }
function show(id, btn) {
  document.querySelectorAll('.section').forEach(x => x.classList.remove('active'));
  ($(id) || $('home')).classList.add('active');
  window.scrollTo(0, 0);
  document.querySelectorAll('.nav').forEach(x => x.classList.toggle('active', x === (btn || navBtn(id))));
}

function clearOldPrivateData() {
  try { Object.keys(localStorage).forEach(k => { if (CONFIG.oldPrivateKeys.some(r => r.test(k))) localStorage.removeItem(k); }); } catch (e) {}
  try { Object.keys(sessionStorage).forEach(k => { if (CONFIG.oldPrivateKeys.some(r => r.test(k))) sessionStorage.removeItem(k); }); } catch (e) {}
}

async function loadAll() {
  await Promise.all(CONFIG.files.map(async f => {
    try {
      const r = await fetch(CONFIG.contentBase + f + '.json', { cache: 'no-cache' });
      if (r.ok) DATA[f] = await r.json();
    } catch (e) { /* offline: service workeren leverer seneste gemte version */ }
  }));
  render();
}

function render() {
  const R = DATA.reunion || {};
  document.querySelectorAll('[data-r]').forEach(el => { const v = R[el.dataset.r]; if (v) el.textContent = v; });
  if (R.motto) $('rMotto').textContent = '“' + R.motto + '”';
  $('rVelkomst').innerHTML = paras(R.velkomst);
  $('rPraktisk').innerHTML = paras(R.praktisk);
  $('rPraktiskWrap').classList.toggle('hidden', !R.praktisk);

  $('progStatus').textContent = R.programstatus || '';
  $('progStatus').classList.toggle('hidden', !R.programstatus);
  const prog = visible(DATA.program);
  $('programList').innerHTML = prog.length ? prog.map(p => '<div class="event"><b>' + esc([p.tid, p.titel].filter(Boolean).join(' · ')) + '</b>'
    + (p.sted ? '<div class="meta">📍 ' + esc(p.sted) + '</div>' : '') + paras(p.beskrivelse)
    + (p.status ? '<span class="tag">' + esc(p.status) + '</span>' : '') + '</div>').join('')
    : '<p class="empty">Programmet offentliggøres senere.</p>';
  $('cProgram').textContent = prog.length ? prog.length + ' programpunkter' : 'Offentliggøres senere';

  const news = visible(DATA.nyheder).slice().sort((a, b) => (b.fastgjort === true) - (a.fastgjort === true) || String(b.dato || '').localeCompare(String(a.dato || '')));
  $('newsList').innerHTML = news.length ? news.map(n => '<div class="panel">' + (n.fastgjort || n.dato ? '<div class="meta">' + (n.fastgjort ? '📌 FASTGJORT' : '') + (n.fastgjort && n.dato ? ' · ' : '') + fmtDate(n.dato) + '</div>' : '')
    + '<h3>' + esc(n.titel) + '</h3>' + paras(n.tekst) + '</div>').join('') : '<div class="panel"><p class="empty">Ingen nyheder endnu.</p></div>';
  const top = news[0];
  $('homeNews').classList.toggle('hidden', !top);
  if (top) { $('homeNewsTitle').textContent = top.titel || ''; $('homeNewsText').textContent = top.tekst ? (top.tekst.length > 140 ? top.tekst.slice(0, 137) + '…' : top.tekst) : ''; }
  $('cNews').textContent = news.length === 1 ? '1 nyhed' : news.length + ' nyheder';

  const ev = visible(DATA.arrangementer).slice().sort((a, b) => String(a.dato || '').localeCompare(String(b.dato || '')));
  $('eventsList').innerHTML = ev.map(e => '<div class="panel"><div class="meta">' + fmtDate(e.dato) + (e.tid ? ' · ' + esc(e.tid) : '') + '</div><h3>' + esc(e.titel) + '</h3>'
    + (e.sted ? '<div class="meta">📍 ' + esc(e.sted) + '</div>' : '') + paras(e.beskrivelse) + '</div>').join('');
  $('cardEvents').classList.toggle('hidden', !ev.length);
  $('cEvents').textContent = ev.length === 1 ? '1 arrangement' : ev.length + ' arrangementer';

  const hi = visible(DATA.historie);
  $('historyList').innerHTML = hi.map(h => '<div class="panel">' + (h.periode ? '<div class="meta">' + esc(h.periode) + '</div>' : '') + '<h3>' + esc(h.titel) + '</h3>'
    + (imgPath(h.billede) ? '<img class="himg" loading="lazy" alt="" src="' + esc(imgPath(h.billede)) + '">' : '') + paras(h.tekst) + '</div>').join('');
  $('cardHistory').classList.toggle('hidden', !hi.length);

  const ph = visible(DATA.billeder).filter(x => imgPath(x.billede));
  const ALBUMS = ['Dengang', 'ST- & MÅLOPKBT', 'Reunion 2027'];
  const groups = ALBUMS.concat(['Øvrige']).map(a => ({ a, items: ph.map((x, i) => ({ x, i })).filter(o => (ALBUMS.includes(o.x.album) ? o.x.album : 'Øvrige') === a) })).filter(g => g.items.length);
  $('photoGrid').innerHTML = ph.length ? groups.map(g => '<h3 class="palbum">' + esc(g.a) + '</h3>' + g.items.map(o => '<button type="button" class="ptile" onclick="openPhoto(' + o.i + ')" aria-label="' + esc(o.x.titel || 'Billede') + '"><img loading="lazy" alt="" src="' + esc(imgPath(o.x.billede)) + '">'
    + '<span class="pcap">' + esc([o.x.titel, o.x.aarstal].filter(Boolean).join(' · ') || 'Billede') + '</span></button>').join('')).join('') : '<p class="empty">Ingen billeder offentliggjort endnu.</p>';
  $('cPhotos').textContent = ph.length === 1 ? '1 billede' : ph.length + ' billeder';
  $('cardPhotos').classList.toggle('hidden', !ph.length);
  PHOTOS = ph;

  let n = 0;
  document.querySelectorAll('.homegrid .card').forEach(c => { if (!c.classList.contains('hidden')) c.querySelector('.cnum').textContent = String(++n).padStart(2, '0') + ' / '; });
  const ct = visible(DATA.kontakt);
  $('contactList').innerHTML = ct.length ? ct.map(c => '<div class="panel ccard"><h3>' + esc(c.navn) + '</h3>' + (c.rolle ? '<div class="meta">' + esc(c.rolle) + '</div>' : '')
    + (c.telefon ? '<a class="cbtn" href="tel:' + esc(String(c.telefon).replace(/[^\d+]/g, '')) + '">📞 ' + esc(c.telefon) + '</a>' : '')
    + (c.email ? '<a class="cbtn" href="mailto:' + esc(c.email) + '">✉️ ' + esc(c.email) + '</a>' : '') + paras(c.note) + '</div>').join('')
    : '<div class="panel"><p class="empty">Kontaktoplysninger offentliggøres senere.</p></div>';
}

let PHOTOS = [];
function openPhoto(i) {
  const x = PHOTOS[i]; if (!x) return;
  $('lbImg').src = imgPath(x.billede);
  $('lbTitle').textContent = x.titel || '';
  $('lbMeta').textContent = [x.aarstal, x.sted].filter(Boolean).join(' · ');
  $('lbDesc').textContent = x.beskrivelse || '';
  $('lightbox').classList.add('on'); document.body.classList.add('lbopen');
}
function closePhoto() { $('lightbox').classList.remove('on'); document.body.classList.remove('lbopen'); $('lbImg').removeAttribute('src'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('lbopen')) closePhoto(); });


/* ===== INTRO – panorering af originalfotoet, ca. 5 s =====
   Vises én gang pr. åbning (sessionStorage), springes over ved "reduceret bevægelse",
   og fjerner sig altid selv efter højst 9 s, så den aldrig kan blokere appen. */
const INTRO = { key: 'r27-intro-vist', durationMs: 7200, maxMs: 9000 };   // sidste billede står ca. 2 s længere
function runIntro() {
  let shown = false;
  try { shown = sessionStorage.getItem(INTRO.key) === '1'; sessionStorage.setItem(INTRO.key, '1'); } catch (e) {}
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (shown || reduce) return;
  const el = document.createElement('div');
  el.className = 'intro'; el.id = 'intro';
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Intro: ST- & MÅLOPKBT Reunion 2027');
  el.innerHTML = '<div class="iphoto"></div><div class="ishade"></div>'
    + '<div class="itext"><div class="il il1">ST- &amp; MÅLOPKBT</div><div class="il il2">REUNION 2027</div>'
    + '<div class="il il3">Lørdag 29. maj 2027 · Varde Kaserne</div></div>'
    + '<button type="button" class="iskip">Spring over</button>';
  let done = false;
  const end = () => {
    if (done) return; done = true;
    el.classList.add('out');
    setTimeout(() => el.remove(), 850);
  };
  el.querySelector('.iskip').addEventListener('click', end);
  document.addEventListener('keydown', function k(e) { if (e.key === 'Escape') { end(); document.removeEventListener('keydown', k); } });
  document.body.appendChild(el);
  // Kameraet glider langs rækken af køretøjer fra venstre mod højre; distancen tilpasses skærmens form.
  const ph = el.querySelector('.iphoto'), travel = Math.max(0, ph.getBoundingClientRect().width - window.innerWidth);
  ph.style.setProperty('--x0', -Math.round(travel * 0.12) + 'px');
  ph.style.setProperty('--x1', -Math.round(travel * 0.88) + 'px');
  // Start, når fotoet er klar (højst 1,2 s ventetid); ellers kører introen på grøn baggrund.
  const start = () => { if (!done) { el.classList.add('run'); setTimeout(end, INTRO.durationMs - 800); } };
  const img = new Image(); let started = false;
  const go = () => { if (!started) { started = true; start(); } };
  img.onload = go; img.onerror = go; img.src = './baggrund-radar.jpg';
  setTimeout(go, 1200);
  setTimeout(end, INTRO.maxMs);   // sikkerhedsnet
}
try { runIntro(); } catch (e) { const i = document.getElementById('intro'); if (i) i.remove(); }

clearOldPrivateData();
loadAll();      // seneste indhold fra GitHub Pages (eller offline-kopi)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadAll(); });

/* ===== Service worker – automatisk opdatering ===== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' })
      .then(function (r) { r.update(); setInterval(function () { r.update(); }, 36e5); })
      .catch(function (e) { console.warn('SW-registrering fejlede', e); });
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (reloaded) return; reloaded = true; location.reload(); });
  });
}
</script></body></html>
